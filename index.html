<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Videó</title>
<style>
  :root {
    --bg: #f4f4f5;
    --card-bg: #ffffff;
    --text: #18181b;
    --muted: #71717a;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0d;
      --card-bg: #18181b;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #60a5fa;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0b0d;
    --card-bg: #18181b;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --accent: #60a5fa;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 16px 40px;
    gap: 16px;
  }

  header {
    width: 100%;
    max-width: 900px;
    text-align: center;
  }

  h1 {
    font-size: clamp(1.25rem, 4vw, 1.75rem);
    margin: 0 0 4px;
    font-weight: 700;
  }

  p.subtitle {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .video-card {
    width: 100%;
    max-width: 900px;
    background: var(--card-bg);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  }

  .video-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }

  .video-wrapper video,
  .video-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    color: #d4d4d8;
    text-align: center;
    padding: 20px;
  }

  .placeholder svg {
    width: 48px;
    height: 48px;
    opacity: 0.6;
  }

  .placeholder p {
    margin: 0;
    font-size: 0.9rem;
    color: #a1a1aa;
    max-width: 320px;
  }

  .info {
    max-width: 900px;
    width: 100%;
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    line-height: 1.5;
  }

  .info code {
    background: var(--card-bg);
    padding: 2px 6px;
    border-radius: 6px;
    color: var(--accent);
    font-size: 0.8em;
  }
</style>
</head>
<body>

  <header>
    <h1>Szia Kicsit</h1>
    <p class="subtitle">Nézd meg ezt a kis videót. Ezt neked szántam.</p>
  </header>

  <div class="video-card">
    <div class="video-wrapper">
            <video controls playsinline preload="metadata" poster="borito.png">
             <source src="romatrip.mp4" type="video/mp4">
           </video>
    </div>
  </div>

  <p class="info">
    A videó lejátszásához kattints bal allul a lejátszás gombra.
  </p>

</body>
</html>
